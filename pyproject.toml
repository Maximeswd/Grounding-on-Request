[project]
name = "grounding-on-request"
version = "0.1.0"
description = "Code and data for Grounding on Request: Learning Modality Control in Vision-Language Models"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
# Pinned to the environment the paper's numbers were produced with; uv.lock pins the full tree.
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers==5.3.0",
    "tokenizers==0.22.2",
    "peft==0.19.1",
    "safetensors==0.8.0",
    "accelerate==1.14.0",
    "datasets==5.0.0",
    "huggingface-hub==1.21.0",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "pandas==3.0.3",
    "pillow",
    "pyyaml",
    "tqdm==4.68.2",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "protobuf==3.20.3",
    "wandb",
]

[dependency-groups]
dev = ["ruff==0.12.2", "mypy>=1.13", "pytest>=8", "hypothesis>=6", "pre-commit>=4"]

[tool.uv]
package = false   # scripts and a local library, not an installable package

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings: module docstrings are kept, per-function ones are not required
    "COM812",  # conflicts with the formatter
    "T201",    # print is the logging of these scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "INP001"]   # asserts are the point of a test; subprocess runs our own scripts; not a package
# Baseline (2026-11-05): the rules each file of the paper's code violated when the standard was adopted.
"evaluate.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ARG001", "ARG005", "B007", "B023", "B905", "BLE001", "C901", "E401", "E501", "E731", "EXE001", "F401", "F841", "FURB122", "I001", "N806", "N812", "PIE810", "PLC0415", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603", "PTH103", "PTH110", "PTH118", "PTH119", "PTH123", "PTH207", "RET504", "RUF005", "S101", "S110", "SIM105", "SIM115", "SLF001", "UP031"]
